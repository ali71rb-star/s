name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: "."
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then chmod +x gradlew; ./gradlew assembleDebug --no-daemon; else gradle assembleDebug --no-daemon; fi
      - name: Save APK in the APK folder
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf /tmp/apks && mkdir -p /tmp/apks
          find . -type f -name '*.apk' \( -path '*/outputs/*' -o -path '*/bin/*' \) -not -path './APK/*' -not -path './.git/*' -print0 > /tmp/apk_list
          if [ ! -s /tmp/apk_list ]; then find . -type f -name '*.apk' -not -path './APK/*' -not -path './.git/*' -print0 > /tmp/apk_list; fi
          if [ ! -s /tmp/apk_list ]; then echo 'No APK file was produced by the build'; exit 1; fi
          while IFS= read -r -d "" apk; do cp "$apk" /tmp/apks/; done < /tmp/apk_list
          git checkout -- . || true
          rm -rf APK && mkdir -p APK
          cp /tmp/apks/*.apk APK/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -f APK
          git commit -m "Add built APK [skip ci]" || echo "Nothing new to commit"
          git pull --rebase --autostash origin "main" || true
          git push origin "HEAD:refs/heads/main"
      - uses: actions/upload-artifact@v4
        with:
          name: "app-debug"
          path: "APK/*.apk"
          if-no-files-found: warn
